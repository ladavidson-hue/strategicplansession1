<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group 2: Safety, Belonging and Behavior · Session 1 · Strategic Plan Refresh 2027–2030</title>
<style>
:root{color-scheme:light;
--navy-50:#EEF5FA;--navy-100:#D5E5F0;--navy-300:#7FAACB;--navy-500:#1B6FA8;--navy-700:#01528A;--navy-900:#003766;
--gold-50:#FFF8DC;--gold-100:#FCEBA1;--gold-300:#EFCD4D;--gold-500:#DEB40A;--gold-700:#A88600;--gold-900:#6E5800;
--teal:#0E9E8E;--teal-soft:#DDF2EF;--purple:#7B4FB0;--purple-soft:#F1E9FA;--coral:#E0584F;--coral-soft:#FDECEA;
--bg:#F3F6FA;--surface:#FFFFFF;--surface-2:#F4F7FB;--text:#0F1A2E;--muted:#4B5563;--border:#D5E5F0;--grid:#E3E9F2;
--error:#B42318;--dot:#B7C3D2;
--font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
--fs-floor:18px;--fs-body:18px;--fs-lead:21px;--fs-h3:24px;--fs-h2:32px;--fs-h1:46px;
--r-panel:18px;--r-card:14px;--shadow:0 1px 2px rgba(15,26,51,.05),0 6px 22px rgba(15,26,51,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0F1A2E;font-family:var(--font);color:var(--text);font-size:var(--fs-body);line-height:1.45}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer}
.num,svg text{font-variant-numeric:tabular-nums}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transform-origin:0 0}
body.zoomfit{display:grid;place-items:center}
body.zoomfit #stage{position:relative;left:auto;top:auto;transform:none}
.progress{height:5px;background:var(--navy-100);flex:none}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--navy-700),var(--gold-500));transition:width .3s}
.top{height:68px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 48px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:14px;white-space:nowrap;font-weight:700;color:var(--navy-900)}.brand img{height:40px}.brand .muted{color:var(--muted);font-weight:500}
.parts{display:flex;gap:6px}
.parts span{display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1.5px solid transparent;font-size:var(--fs-floor)}
.parts span i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--navy-100);color:var(--navy-900);font-size:14px}
.parts span.on{background:var(--navy-900);color:#fff}.parts span.on i{background:var(--gold-500);color:var(--navy-900)}
.parts span.done{color:var(--navy-700)}.parts span.done i{background:var(--navy-700);color:#fff}
.counter{justify-self:end;display:flex;align-items:center;gap:12px;background:var(--navy-900);color:#fff;border:0;border-radius:12px;padding:10px 20px;font-weight:800;font-size:22px}
.counter .chev{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #fff}
.jump{position:absolute;right:48px;top:76px;z-index:50;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(15,26,46,.25);padding:8px;display:none;min-width:520px}
.jump.on{display:block}.jump button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 14px;font-size:var(--fs-body);color:var(--text)}
.jump button:hover,.jump button.cur{background:var(--navy-50)}.jump b{width:28px;color:var(--navy-700)}
#screens{position:relative;flex:1 1 auto;min-height:0}
.screen{position:absolute;inset:0;padding:30px 56px 22px;display:none;flex-direction:column;gap:20px}
.screen.on{display:flex}
.s-head{display:grid;grid-template-columns:auto 1fr;column-gap:20px;align-items:start;flex:none}
.s-head .chip{margin-top:9px}
.ht{display:flex;flex-direction:column;gap:4px}
.chip{flex:none;font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:8px;background:var(--navy-900);color:#fff}
.chip.gold{background:var(--gold-500);color:var(--navy-900)}.chip.coral{background:var(--coral);color:#fff}.chip.teal{background:var(--teal);color:#fff}
.s-head h1{font-size:40px;line-height:1.12;font-weight:800;color:var(--navy-900);letter-spacing:-.015em}
.sub{font-size:23px;color:var(--muted);font-weight:500}
.s-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px}
.card{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--shadow);border:1px solid var(--border)}
.rv{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}.rv.show{opacity:1;transform:none}
.bottom{height:72px;flex:none;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:28px;padding:0 48px;background:var(--surface);border-top:1px solid var(--border)}
.src{font-size:16px;color:var(--muted)}
.hint{font-size:var(--fs-floor);color:var(--navy-300)}
.navbtns{display:flex;gap:12px}
.navbtns button{min-width:120px;padding:10px 22px;border-radius:12px;font-weight:800;font-size:22px;border:2px solid var(--navy-700);background:#fff;color:var(--navy-700)}
.navbtns button.primary{background:var(--navy-700);color:#fff}.navbtns button.reveal{background:var(--gold-500);border-color:var(--gold-500);color:var(--navy-900)}
.notes{position:absolute;left:48px;right:48px;bottom:84px;z-index:60;background:rgba(0,55,102,.96);color:#fff;border-radius:16px;padding:20px 28px;font-size:22px;line-height:1.45;display:none;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.notes.on{display:block}.notes b{color:var(--gold-300)}
/* hero screens */
.screen.hero{padding:0;background:radial-gradient(circle at 78% 30%,#0B4F86 0,#003766 55%,#00284D 100%);color:#fff}
.hero-in{position:relative;flex:1;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding:0 110px;gap:40px}
.hero .kick{font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-300);font-size:20px}
.hero h1{font-size:88px;line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:22px 0 18px}
.hero .lead{font-size:30px;color:#C9DCEE;line-height:1.35}
.hero .by{margin-top:46px;display:flex;align-items:center;gap:18px;font-size:22px;color:#AFC6DC}.hero .by b{color:#fff}
.hero .bar{width:90px;height:8px;background:var(--gold-500);border-radius:4px;margin-top:40px}
.bign{font-size:420px;font-weight:900;line-height:.8;letter-spacing:-.06em;color:var(--gold-500);text-align:center;text-shadow:0 12px 50px rgba(0,0,0,.25)}
.bign small{display:block;font-size:44px;letter-spacing:.02em;color:#fff;font-weight:800;margin-top:26px;text-shadow:none}
.wm{position:absolute;right:-60px;bottom:-80px;width:620px;opacity:.07;pointer-events:none}
.corner{position:absolute;left:0;bottom:0;width:0;height:0;border-bottom:150px solid var(--gold-500);border-right:520px solid transparent}
/* countdown */
.cd{display:grid;grid-template-columns:560px 1fr;gap:48px;align-items:center}
.cd-nums{display:flex;flex-direction:column;gap:18px}
.cd-n{display:flex;align-items:center;gap:26px;padding:18px 28px;border-radius:var(--r-card);background:#fff;box-shadow:var(--shadow);border-left:12px solid var(--navy-300)}
.cd-n b{font-size:84px;font-weight:900;line-height:1;letter-spacing:-.04em;width:170px;color:var(--navy-300)}
.cd-n span{font-size:28px;font-weight:700;color:var(--text);line-height:1.2}
.cd-n.past{border-left-color:var(--navy-700)}.cd-n.past b{color:var(--navy-700)}
.cd-n.left{border-left-color:var(--gold-500);background:var(--gold-50)}.cd-n.left b{color:var(--gold-700);font-size:104px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;padding:22px 26px;border-radius:var(--r-panel);background:#fff;box-shadow:var(--shadow)}
.days .dh{text-align:center;font-weight:800;color:var(--muted);font-size:var(--fs-floor);letter-spacing:.06em}
.day{height:60px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:24px}
.day.p{background:var(--navy-700);color:#fff}.day.p::after{content:"\2713";font-size:30px}
.day.l{background:var(--gold-50);border:3px solid var(--gold-500);color:var(--gold-900)}
.day.l.first{background:var(--gold-500);color:var(--navy-900)}
.ask{font-size:44px;font-weight:900;color:var(--navy-900);text-align:center;padding:20px;border-radius:var(--r-panel);background:linear-gradient(90deg,var(--gold-100),var(--gold-50));border:3px solid var(--gold-500)}
/* start */
.st{display:grid;grid-template-columns:780px 1fr;gap:36px;align-items:stretch;flex:1;min-height:0}
.funnel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:30px 34px}
.fs .fn{display:flex;align-items:baseline;gap:18px}.fs .fn b{font-size:64px;font-weight:900;letter-spacing:-.03em;color:var(--navy-900);line-height:1}
.fs .fn span{font-size:22px;color:var(--text)}
.fbar{height:30px;border-radius:8px;margin-top:10px;display:flex;overflow:hidden;background:var(--surface-2)}
.fbar i{display:block;height:100%}
.fpct{font-size:var(--fs-body);font-weight:800;color:var(--gold-700)}
.schools{padding:24px 30px;display:flex;flex-direction:column;gap:12px}
.ct{font-size:var(--fs-h3);font-weight:800;color:var(--navy-900)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:19px;color:var(--muted);font-weight:600}.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:7px;vertical-align:-3px}
/* waffles */
.wf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 380px;gap:26px;align-items:stretch}
.wcard{padding:26px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.wcard .lv{font-weight:900;font-size:24px;padding:6px 18px;border-radius:10px}
.wgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;width:100%;max-width:280px}
.wgrid i{display:block;aspect-ratio:1;border-radius:4px;background:#E8EDF3}
.wcard .p{font-size:66px;font-weight:900;letter-spacing:-.03em;line-height:1}
.wcard .c{font-size:21px;color:var(--muted);text-align:center;line-height:1.3}
.wcard .c.red{color:var(--error);font-weight:700}.wcard .c.red b{color:var(--error)}
.proof{padding:30px 32px;display:flex;flex-direction:column;justify-content:center;gap:12px;background:var(--navy-900);color:#fff;border:0}
.proof .k{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-300);font-size:18px}
.proof b{white-space:nowrap;font-size:64px;font-weight:900;line-height:1;letter-spacing:-.03em}
.proof p{font-size:24px;color:#C9DCEE;line-height:1.35}
.callout{display:flex;align-items:center;gap:24px;padding:20px 30px;border-radius:var(--r-card);background:var(--gold-50);border-left:10px solid var(--gold-500);font-size:26px}
.callout b{color:var(--navy-900)}.callout .n{font-size:58px;font-weight:900;color:var(--navy-700);letter-spacing:-.02em;line-height:1}
/* discussion */
.screen.talk{padding:0;flex-direction:row;gap:0;background:#fff}
.tpanel{width:700px;flex:none;background:var(--gold-500);display:flex;flex-direction:column;justify-content:center;padding:60px 64px;gap:22px;position:relative;overflow:hidden}
.tpanel .k{font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-900);font-size:22px}
.tpanel h2{font-size:60px;font-weight:900;color:var(--navy-900);line-height:1.05;letter-spacing:-.02em}
.tpanel .how{font-size:24px;color:var(--navy-900);line-height:1.35;font-weight:600}
.timer{margin-top:14px;display:flex;align-items:center;gap:20px}
.timer .clock{font-size:118px;font-weight:900;color:var(--navy-900);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;min-width:330px}
.timer button{border:3px solid var(--navy-900);background:var(--navy-900);color:#fff;border-radius:14px;padding:12px 24px;font-weight:900;font-size:24px}
.timer button.ghost{background:transparent;color:var(--navy-900)}
.timer.warn .clock{color:#8A1C12}.timer.done .clock{color:#8A1C12;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.phase{font-size:22px;font-weight:800;color:var(--navy-900);background:rgba(255,255,255,.55);border-radius:10px;padding:8px 16px;align-self:flex-start}
.tbubble{position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.18)}
.tright{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 90px;gap:34px}
.q{display:grid;grid-template-columns:72px 1fr;gap:24px;align-items:start}
.q .qn{width:72px;height:72px;border-radius:50%;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-weight:900;font-size:34px}
.q p{font-size:44px;font-weight:800;color:var(--navy-900);line-height:1.18;letter-spacing:-.01em}
.q.alt .qn{background:var(--gold-500);color:var(--navy-900)}.q.alt p{color:var(--gold-900)}
.q.sm p{font-size:34px}
.elsch{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;margin-top:6px}
.elsch .r{display:grid;grid-template-columns:230px 1fr 60px;align-items:center;gap:12px;font-size:20px}
.elsch .r b{font-weight:700;color:var(--navy-900);white-space:nowrap}
.elsch .r .bb{height:16px;border-radius:5px;background:var(--teal)}
.elsch .r .v{font-weight:800;text-align:right;color:var(--navy-900)}.elsch .r .v.s{color:var(--muted);font-weight:600}
/* mirror strips */
.strips{padding:18px 40px 22px;display:flex;flex-direction:column;gap:6px}
.strow{display:grid;grid-template-columns:400px 1fr 290px;gap:30px;align-items:center;padding:26px 0;border-bottom:1px solid var(--grid)}
.strow:last-child{border-bottom:0}
.strow .lab b{display:block;font-size:28px;font-weight:800;color:var(--navy-900);line-height:1.2}
.strow .lab span{font-size:18px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.strow .rk{display:flex;flex-direction:column;gap:2px}
.strow .rk b{font-size:52px;font-weight:900;color:var(--coral);line-height:1;letter-spacing:-.02em}
.strow .rk span{font-size:22px;color:var(--text)}
.strow .rk em{font-style:normal;font-size:var(--fs-floor);color:var(--muted)}
/* trend */
.tr{display:grid;grid-template-columns:1fr 430px;gap:34px;align-items:stretch;flex:1;min-height:0}
.trc{padding:24px 26px}
.tside{display:flex;flex-direction:column;gap:22px}
.tbig{padding:30px 32px;background:var(--coral-soft);border:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.tbig b{display:block;font-size:96px;font-weight:900;color:var(--coral);letter-spacing:-.03em;line-height:1}
.tbig p{font-size:27px;color:var(--text);margin-top:10px;line-height:1.3}
.tgood{padding:28px 32px;background:var(--teal-soft);border:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.tgood .k{font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-size:var(--fs-floor)}
.tgood p{font-size:26px;line-height:1.35;margin-top:6px}.tgood b{color:#0B6E63}
/* EL */
.elw{display:grid;grid-template-columns:430px 1fr;gap:32px;align-items:stretch;flex:1;min-height:0}
.badge{background:var(--coral);color:#fff;border-radius:var(--r-panel);padding:34px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px;box-shadow:var(--shadow)}
.badge .k{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:var(--fs-floor);color:#FFE3E0}
.badge b{font-size:150px;font-weight:900;line-height:.9;letter-spacing:-.05em}
.badge b sup{font-size:60px;vertical-align:top;margin-left:4px}
.badge p{font-size:26px;line-height:1.3}
.badge .of{font-size:22px;color:#FFE3E0}
.dumb{padding:24px 34px;display:flex;flex-direction:column;justify-content:center;min-height:0}
.dumb svg{flex:1;min-height:0}
/* plan */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.tile{border-radius:var(--r-panel);padding:28px 28px 30px;display:flex;flex-direction:column;gap:14px;color:#fff;min-height:300px;box-shadow:var(--shadow)}
.tile svg{width:58px;height:58px}
.tile .h{font-size:30px;font-weight:900;letter-spacing:.06em}
.tile p{font-size:28px;font-weight:700;line-height:1.25}
.t1{background:var(--navy-700)}.t2{background:var(--teal)}.t3{background:var(--purple)}.t4{background:var(--gold-500);color:var(--navy-900)}
.ex{padding:20px 26px}
.ex .k{font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-700);margin-bottom:10px}
table.pl{width:100%;border-collapse:separate;border-spacing:0}
table.pl th{font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:#fff;padding:10px 14px;text-align:left}
table.pl th:nth-child(1){background:var(--navy-900);border-radius:10px 0 0 0}table.pl th:nth-child(2){background:var(--navy-700)}table.pl th:nth-child(3){background:var(--teal)}table.pl th:nth-child(4){background:var(--purple)}table.pl th:nth-child(5){background:var(--gold-500);color:var(--navy-900)}table.pl th:nth-child(6){background:var(--coral);border-radius:0 10px 0 0}
table.pl td{font-size:23px;padding:18px 16px;border-bottom:1px solid var(--grid);vertical-align:top;line-height:1.3;background:#FCFDFE}
.onenum{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--navy-900);color:#fff;border-radius:var(--r-panel);padding:22px 30px;text-align:center;flex:none}
.onenum .b1{font-size:30px;font-weight:900;color:var(--gold-300)}.onenum span{font-size:28px;font-weight:700;line-height:1.3}
/* rhythm */
.rh{display:grid;grid-template-columns:1fr 600px;gap:34px;align-items:stretch;flex:1;min-height:0}
.cal{padding:22px 28px;display:flex;flex-direction:column;gap:12px}
.cal .mh{display:flex;align-items:baseline;justify-content:space-between}
.cal .mh b{font-size:28px;font-weight:900;color:var(--navy-900)}.cal .mh span{font-size:var(--fs-floor);color:var(--muted);font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cgrid .dn{text-align:center;font-size:var(--fs-floor);font-weight:800;color:var(--muted);letter-spacing:.06em}
.cday{position:relative;height:168px;border-radius:12px;background:var(--surface-2);padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.cday .d{font-weight:800;color:var(--muted);font-size:20px}
.cday.wk1{background:var(--gold-50);outline:3px solid var(--gold-500)}
.cday.off{background:#fff;border:2px dashed var(--grid)}.cday.off .d{color:#C3CCD8}
.ev{font-size:18px;font-weight:800;line-height:1.15;border-radius:7px;padding:5px 8px;color:#fff}
.ev.e1{background:var(--navy-700)}.ev.e3{background:var(--teal)}.ev.e5{background:var(--purple)}.ev.ew{background:var(--coral)}
.steps{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.stp{flex:1}
.stp{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:18px;padding:16px 20px;border-radius:var(--r-card);background:#fff;box-shadow:var(--shadow);border-left:10px solid var(--navy-700)}
.stp b{font-size:24px;font-weight:900;color:var(--navy-900);line-height:1.1}.stp span{font-size:22px;line-height:1.3}
.stp.s3{border-left-color:var(--teal)}.stp.s5{border-left-color:var(--purple)}.stp.sw{border-left-color:var(--coral)}
.decide{display:grid;grid-template-columns:auto repeat(4,1fr);gap:14px;align-items:center}
.decide .k{font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-900);font-size:var(--fs-body)}
.decide span{background:var(--gold-500);color:var(--navy-900);border-radius:14px;padding:18px;text-align:center;font-weight:900;font-size:25px}
/* MS groups */
.msg{display:grid;grid-template-columns:1.6fr 1fr;gap:30px;flex:1;min-height:0}
.gl{padding:24px 30px;display:flex;flex-direction:column;justify-content:space-between}
.gr{display:grid;grid-template-columns:42px 270px 1fr 90px;align-items:center;gap:14px;padding:6px 0}
.gr .o{width:38px;height:38px;border-radius:50%;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px}
.gr b{display:block;font-size:23px;color:var(--navy-900);line-height:1.1}.gr small{font-size:19px;color:var(--muted)}
.gr .bw{height:30px;border-radius:7px;background:var(--surface-2);overflow:hidden}.gr .bw i{display:block;height:100%;border-radius:7px}
.gr .v{font-size:26px;font-weight:900;color:var(--navy-900);text-align:right}
.gl .tier{border-top:2px dashed var(--navy-300);margin-top:4px;padding-top:6px;font-size:17px;font-weight:700;color:var(--navy-700)}
.ss{display:flex;flex-direction:column;gap:12px}
.ss .k{font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);font-size:var(--fs-floor)}
.ssg{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.sc{background:#fff;border-radius:var(--r-card);box-shadow:var(--shadow);border-top:7px solid var(--purple);padding:12px 18px;display:flex;flex-direction:column;justify-content:center}
.sc span{font-size:16px;font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.06em}
.sc b{font-size:21px;color:var(--navy-900);line-height:1.2}.sc em{font-style:normal;font-size:36px;font-weight:900;color:var(--navy-900);line-height:1}
.sc.sum{background:var(--purple);border-top-color:var(--gold-500)}.sc.sum b,.sc.sum em,.sc.sum span{color:#fff}
/* handoff */
.ho{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0}
.hoc{padding:22px 30px;display:flex;flex-direction:column;gap:6px}
.hoc .t{font-size:28px;font-weight:900;color:var(--navy-900)}.hoc .s{font-size:21px;color:var(--muted)}
.hoc .note{margin-top:auto;font-size:23px;line-height:1.35;padding:12px 16px;border-radius:12px}
.note.good{background:var(--teal-soft);color:#0B5F55}.note.bad{background:var(--coral-soft);color:#8A1C12}
.drop{display:flex;align-items:center;gap:26px;padding:20px 30px;border-radius:var(--r-card);background:var(--coral);color:#fff;font-size:27px;box-shadow:var(--shadow)}
.drop b{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.03em}.drop span{line-height:1.3}
/* next year's freshmen */
.nx{display:grid;grid-template-columns:600px 1fr;gap:30px;flex:1;min-height:0}
.nxl{display:flex;flex-direction:column;gap:18px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bt{border-radius:var(--r-panel);padding:22px 24px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.bt b{font-size:96px;font-weight:900;line-height:.95;letter-spacing:-.04em}.bt span{font-size:22px;font-weight:700;line-height:1.25}
.bt.u{background:#FBD9D7;color:#5A1210}.bt.h{background:#FDE8CC;color:#5A3A08}
.past{padding:20px 24px;font-size:22px;line-height:1.4}.past b{color:var(--navy-900)}
.proj{background:var(--navy-900);color:#fff;border-radius:var(--r-panel);padding:22px 26px;font-size:24px;line-height:1.35}
.proj b{color:var(--gold-300);font-size:44px;font-weight:900;display:block;line-height:1.05}
.nxr{padding:22px 30px;display:flex;flex-direction:column;justify-content:space-between}
.mrow{display:grid;grid-template-columns:210px 1fr 60px;gap:12px;align-items:center;font-size:21px;padding:6px 0}
.mrow b{color:var(--navy-900);font-weight:700}.mrow .bb{height:22px;border-radius:6px;background:linear-gradient(90deg,#F0706A,#F5A742)}
.mrow .v{font-weight:900;color:var(--navy-900);text-align:right}.mrow .v.s{color:var(--muted);font-weight:600}
.tpanel.navy{background:var(--navy-900)}.tpanel.navy .k,.tpanel.navy h2,.tpanel.navy .how,.tpanel.navy .timer .clock,.tpanel.navy .phase{color:#fff}.tpanel.navy .k{color:var(--gold-300)}
.tpanel.navy .phase{background:rgba(255,255,255,.16)}.tpanel.navy .timer button{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}.tpanel.navy .timer button.ghost{background:transparent;color:#fff;border-color:#fff}
.tpanel.teal{background:var(--teal)}.tpanel.teal .k,.tpanel.teal h2,.tpanel.teal .how,.tpanel.teal .timer .clock,.tpanel.teal .phase{color:#fff}
.tpanel.teal .phase{background:rgba(255,255,255,.18)}.tpanel.teal .timer button{background:#fff;color:#0B5F55;border-color:#fff}.tpanel.teal .timer button.ghost{background:transparent;color:#fff}
.tpanel.navy{background:var(--navy-900)}.tpanel.navy .k,.tpanel.navy h2,.tpanel.navy .how,.tpanel.navy .timer .clock,.tpanel.navy .phase{color:#fff}
.tpanel.navy .k{color:var(--gold-300)}.tpanel.navy .phase{background:rgba(255,255,255,.14)}.tpanel.navy .timer button{background:var(--gold-500);color:var(--navy-900);border-color:var(--gold-500)}.tpanel.navy .timer button.ghost{background:transparent;color:#fff;border-color:#fff}
.who{display:inline-block;font-size:17px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:6px;margin-right:10px;vertical-align:4px}
.who.hs{background:var(--navy-900);color:#fff}.who.ms{background:var(--purple);color:#fff}.who.both{background:var(--teal);color:#fff}
.closecards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
.cc{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:18px 22px;font-size:24px;line-height:1.3;color:#E3EEF8}
.cc b{display:block;color:var(--gold-300);font-size:18px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
/* header takeaway */
.take{display:flex;align-items:center;gap:22px;background:var(--navy-900);color:#fff;border-radius:var(--r-panel);padding:18px 30px;box-shadow:var(--shadow);flex:none}
.take .tk{flex:none;font-size:16px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--navy-900);background:var(--gold-500);border-radius:8px;padding:6px 12px}
.take p{font-size:31px;font-weight:800;line-height:1.2}
.ctrow{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.foot{font-size:18px;color:var(--muted);margin-top:4px}
/* hero one column */
.hero-one{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 130px}
.hero-one h1{font-size:96px;line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:22px 0 10px;max-width:1600px}
.hero-one .bar{width:110px;height:9px;background:var(--gold-500);border-radius:4px;margin-top:34px}
.hero-one .by{margin-top:30px;display:flex;align-items:center;gap:22px;font-size:26px;color:#AFC6DC}.hero-one .by b{color:#fff}
.hero-one .lead{font-size:36px;color:#C9DCEE;line-height:1.35;max-width:1400px}.hero-one .lead b{color:#fff}
.hero-one.cl h1{font-size:150px}
.hero-one.ins h1{font-size:76px}
.icards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:34px}
.ic{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.22);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.ic span{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-300)}
.ic b{font-size:27px;line-height:1.3;color:#fff}.ic b.chips{display:flex;flex-wrap:wrap;gap:10px}
.lvc{display:inline-block;font-size:22px;font-weight:900;padding:6px 14px;border-radius:10px}
.q2{margin-top:36px;font-size:40px;font-weight:800;color:var(--gold-300)}
/* CGCS intro */
.cg{display:grid;grid-template-columns:620px 1fr;gap:30px;flex:1;min-height:0}
.cgw{background:var(--navy-900);color:#fff;border-radius:var(--r-panel);padding:34px 38px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.cgw .k{font-size:24px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-300);margin-top:14px}
.cgw p{font-size:28px;line-height:1.35;color:#E3EEF8}.cgw p b{color:#fff}
.cgm{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.mc{background:#fff;border-radius:var(--r-panel);box-shadow:var(--shadow);border:1px solid var(--border);padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.mc .mi{width:54px;height:54px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px}
.mc b{font-size:30px;color:var(--navy-900);line-height:1.15}.mc p{font-size:24px;line-height:1.35;color:var(--text)}
/* other ways to segment */
.others{padding:24px 28px;display:flex;flex-direction:column;justify-content:space-between}
.others .k{font-size:20px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}
.or{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.or:last-child{border-bottom:0}
.or .sn{font-size:20px;font-weight:900;color:var(--purple)}.or .sg{font-size:21px;color:var(--text);line-height:1.25}.or .sv{font-size:30px;font-weight:900;color:var(--navy-900);text-align:right}
/* next year's freshmen */
.n4{display:grid;grid-template-columns:1fr 1fr 1.25fr 1.25fr;gap:20px;flex:none}
.n4 .bt,.n4 .past,.n4 .proj{min-height:200px;display:flex;flex-direction:column;justify-content:center}
.n4 .past{padding:22px 26px}.n4 .past .k{font-size:18px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-700)}
.n4 .past p{font-size:26px;line-height:1.3;margin-top:6px}.n4 .past b{color:var(--navy-900)}
.n4 .proj{font-size:24px}.n4 .proj span{font-size:24px;line-height:1.3}
.colc{flex:1;min-height:0;padding:20px 28px;display:flex;flex-direction:column;gap:6px}
.colc svg{flex:1;min-height:0}
/* 19 days later */
.quote{display:flex;align-items:center;gap:22px;background:var(--gold-50);border:3px solid var(--gold-500);border-radius:var(--r-panel);padding:16px 30px;flex:none}
.quote .qm{font-size:110px;line-height:.6;font-weight:900;color:var(--gold-500);height:50px}
.quote p{font-size:30px;font-weight:700;color:var(--navy-900);line-height:1.3}
.nw{display:grid;grid-template-columns:520px 1fr;gap:28px;flex:1;min-height:0}
.nts{display:flex;flex-direction:column;gap:16px}
.nt{flex:1;background:#fff;border-radius:var(--r-panel);box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 26px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.nt b{font-size:54px;font-weight:900;color:var(--navy-900);line-height:1;letter-spacing:-.03em}.nt span{font-size:22px;line-height:1.25}.nt em{font-style:normal;font-size:19px;color:var(--muted);font-weight:700}
.nw .schools{display:flex;flex-direction:column;min-height:0;padding:18px 26px}.nw .schools svg{flex:1;min-height:0}
.nw .nts{min-height:0}
/* sources */
.srcs{padding:40px 50px;display:flex;flex-direction:column;gap:26px;font-size:25px;line-height:1.45}
.srcs b{color:var(--navy-900)}

/* ===== Group 1 additions, written on the same tokens ===== */
/* header meta: who leads · minutes */
.s-head{grid-template-columns:auto 1fr auto}
.meta{margin-top:12px;display:flex;gap:14px;align-items:center;font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.meta i{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--gold-500)}
.meta b{color:var(--navy-700)}
/* numbered editorial rows (built from .q and .strow) */
.lrows{display:flex;flex-direction:column;padding:6px 36px}
.lrow{display:grid;grid-template-columns:64px 1fr;gap:22px;align-items:start;padding:20px 0;border-bottom:1px solid var(--grid)}
.lrow:last-child{border-bottom:0}
.lrow .qn{width:52px;height:52px;border-radius:50%;background:var(--navy-900);color:#fff;display:grid;place-items:center;font-weight:900;font-size:24px;margin-top:2px}
.lrow.alt .qn{background:var(--gold-500);color:var(--navy-900)}
.lrow b{display:block;font-size:27px;font-weight:800;color:var(--navy-900);line-height:1.2}
.lrow p{font-size:22px;line-height:1.35;color:var(--text);margin-top:4px}
.lrows.two{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;padding:6px 36px}
.lrows.tight .lrow{padding:14px 0}
/* plain rows with a thin divider, no numeral (built from .or) */
.drows{display:flex;flex-direction:column}
.drow{padding:12px 0;border-bottom:1px solid var(--grid);font-size:22px;line-height:1.35}
.drow:last-child{border-bottom:0}
.drow b{color:var(--navy-900)}
/* big-number row, from the funnel's .fn */
.nrow{display:grid;grid-template-columns:repeat(4,1fr);align-items:stretch}
.nrow>div{padding:10px 34px;border-left:1px solid var(--grid);display:flex;flex-direction:column;gap:8px}
.nrow>div:first-child{border-left:0;padding-left:0}
.nrow .k{font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-700)}
.nrow b{font-size:68px;font-weight:900;letter-spacing:-.03em;color:var(--navy-900);line-height:1}
.nrow b small{font-size:28px;font-weight:800;letter-spacing:0;margin-left:8px;color:var(--navy-700)}
.nrow p{font-size:21px;line-height:1.35;color:var(--text)}
/* horizontal bar rows (from .gr / .mrow) */
.hb{display:grid;grid-template-columns:var(--lab,360px) 1fr 86px;gap:16px;align-items:center;padding:7px 0}
.hb .l{font-size:22px;color:var(--navy-900);font-weight:700;line-height:1.2}
.hb .l small{display:block;font-size:17px;color:var(--muted);font-weight:600}
.hb .bw{height:30px;border-radius:7px;background:var(--surface-2);overflow:hidden}.hb .bw i{display:block;height:100%;border-radius:7px;background:var(--navy-300)}
.hb.on .bw i{background:var(--gold-500)}.hb.alt .bw i{background:var(--teal)}.hb.dim .bw i{background:var(--navy-100)}
.hb .v{font-size:27px;font-weight:900;color:var(--navy-900);text-align:right}
.hb.sm{padding:3px 0;grid-template-columns:var(--lab,360px) 1fr 70px}.hb.sm .l{font-size:20px}.hb.sm .bw{height:22px}.hb.sm .v{font-size:22px}
/* quotes: the gold quote strip, plus a plain white version for a set */
.qset{display:grid;gap:18px;min-height:0}
.qset .quote{align-items:flex-start;padding:22px 28px;gap:18px}
.qset .quote.plain{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow)}
.qset .quote.plain .qm{color:var(--navy-300)}
.qset .quote p{font-size:24px;font-weight:600;line-height:1.35}
.qset .quote.lg p{font-size:27px}
.qset .quote small{display:block;margin-top:10px;font-size:17px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.qset .quote .qm{flex:none;margin-top:14px}
.qh{font-size:17px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-700);margin-bottom:8px}
/* soft panels, from .tgood / .tbig */
.soft{padding:26px 32px;border-radius:var(--r-panel);display:flex;flex-direction:column;gap:10px;min-height:0}
.soft.teal{background:var(--teal-soft)}.soft.teal .k{color:#0B6E63}
.soft.gold{background:var(--gold-50)}.soft.gold .k{color:var(--gold-900)}
.soft.navy{background:var(--navy-50)}.soft.navy .k{color:var(--navy-700)}
.soft .k{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:var(--fs-floor)}
.soft .h{font-size:30px;font-weight:800;color:var(--navy-900);line-height:1.2}
.soft p{font-size:24px;line-height:1.38}
.soft .drow{font-size:22px}
.soft .note{margin-top:auto;font-size:20px;line-height:1.35;color:var(--muted);padding-top:12px;border-top:1px solid rgba(0,55,102,.12)}
/* link button, gold */
.lk{display:inline-block;background:var(--gold-500);color:var(--navy-900);text-decoration:none;font-weight:900;padding:12px 22px;border-radius:12px;font-size:21px;align-self:flex-start}
.cgw .lk{margin-top:8px}
/* planner table variant: three session columns */
table.pl.sess th:nth-child(1){background:var(--navy-900)}table.pl.sess th:nth-child(2){background:var(--gold-500);color:var(--navy-900)}table.pl.sess th:nth-child(3){background:var(--navy-700);border-radius:0}table.pl.sess th:nth-child(4){background:var(--teal);border-radius:0 10px 0 0}
table.pl td.rk{font-size:17px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
table.pl td.now{background:var(--gold-50)}
/* agenda */
table.ag{width:100%;border-collapse:collapse}
table.ag th{text-align:left;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy-700);padding:8px 14px;border-bottom:2px solid var(--navy-100)}
table.ag td{font-size:23px;padding:14px 14px;border-bottom:1px solid var(--grid);line-height:1.3}
table.ag td.t{font-weight:900;color:var(--navy-900);white-space:nowrap;font-variant-numeric:tabular-nums}
/* hero cover variants */
.hero-one .kick2{font-size:40px;font-weight:700;color:#C9DCEE;letter-spacing:.01em;margin-top:26px}
.hero-one .fac{margin-top:34px;display:grid;grid-template-columns:auto auto;gap:6px 40px;font-size:25px;color:#AFC6DC;align-items:baseline}
.hero-one .fac b{color:#fff;font-weight:800}.hero-one .fac span{color:#C9DCEE}
.hero-one .fk{font-size:18px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-300);margin-top:40px}
/* hand-drawn pencil circle around a key number */
.pc{position:relative;display:inline-block;white-space:nowrap}
.pc svg{position:absolute;left:-12%;top:-22%;width:124%;height:146%;overflow:visible;pointer-events:none}
.pc svg path{fill:none;stroke:var(--gold-700);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:.92}
.pc.coral svg path{stroke:var(--coral)}.pc.light svg path{stroke:var(--gold-300)}
.pc.draw svg path{animation:pencil 1.1s cubic-bezier(.3,.6,.2,1) .35s forwards}
@keyframes pencil{to{stroke-dashoffset:0}}
.pc.draw svg path.p2{animation-delay:1.25s;animation-duration:.5s}
/* talk right side: a supporting soft panel under the questions */
.tright .soft{margin-top:6px}
.tright .q p{font-size:38px}
.tright .q.sm p{font-size:32px}
/* close screen */
.nxt{display:grid;grid-template-columns:1fr 620px;gap:30px;flex:1;min-height:0}
.steps.v{justify-content:stretch}
.stp.g{border-left-color:var(--gold-500)}.stp.t{border-left-color:var(--teal)}
/* fraction rows ("1 in 3") built on .strow */
.frows{padding:10px 36px}
.frows .strow{grid-template-columns:190px 1fr;gap:26px;padding:17px 0}
.frows .rk b{color:var(--navy-700);font-size:54px;white-space:nowrap}
.frows .lab b{font-size:26px}.frows .lab p{font-size:21px;line-height:1.35;color:var(--text);margin-top:4px}
/* two-column theme list */
.themes2{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;padding:4px 36px}
.th{padding:13px 0;border-bottom:1px solid var(--grid);display:flex;flex-direction:column;gap:5px}
.th:nth-child(7),.th:nth-child(8){border-bottom:0}
.th b{font-size:24px;color:var(--navy-900);line-height:1.2}.th p{font-size:19.5px;line-height:1.32;color:var(--text)}
.th .srcs2{display:flex;gap:8px;margin-top:2px}.th .who{margin:0;vertical-align:0;font-size:14px;padding:3px 9px}
/* QA pass 1 */
.card.lrows{flex:1;justify-content:center}
.lrows.two{align-content:space-evenly}
.callout .qh{display:block}
.qset{min-height:0}.qset .quote{min-height:0;align-items:center}
.qset .quote.plain p{font-size:23px}
.frows .rk .pc{font-size:inherit;color:inherit}
.soft .drows,.mc .drows{flex:1;display:flex;flex-direction:column;justify-content:center}
.soft .drow,.mc .drow{font-size:24px;padding:15px 0}
.mc{justify-content:center}
.hb{padding:9px 0}.hb .bw{height:36px}
.pc svg{left:-13%;top:-28%;width:126%;height:156%}
table.ag td{padding:20px 14px;font-size:24px}
.stp span{font-size:24px}
.card.frows{flex:1;display:flex;flex-direction:column;justify-content:center}
/* QA pass 2 */
.soft{justify-content:center}.soft .drows,.mc .drows{flex:0 1 auto}
.soft .note{margin-top:18px}
.lrow b{font-size:28px}.lrow p{font-size:23px}

const RACE_MAP = {'Caucasian': 'White', 'Black': 'African American', 'American Indian/Alaska Native': 'American Indian', 'Asian': 'Asian', 'Hispanic': 'Hispanic', 'Multiracial': 'Multiracial', 'Pacific Islander': 'Pacific Islander'};
const avgPos = vals => { const ks = TOPICS.map(t => t[0]).filter(k => vals[k] != null); return ks.reduce((a, k) => a + vals[k], 0) / ks.length; };
function climateGroupRows() {

  {id: 'area', part: 0, src: 'Committee packet. The areas are a starting frame, not a limit.', html: () =>
    head('How we’ll work', 'What this area is about', '', '', ['Chief', '2 min']) +
    '<div class="s-body" style="gap:18px"><div class="cg wgfit"><div class="cgw"><div class="k">Builds on</div><p><b>Safety and Belonging</b>, one of the 2023–2026 goals, continues here with behavior added to its name.</p><p>Whether students and adults are safe at school, whether every student has a trusted adult and a place to belong, and how the district responds to behavior.</p><div class="k">Today</div><p>The goal statement itself is a session 2 activity. Today is about hearing the evidence and generating action-step ideas.</p></div>' +
    '<div class="cgm"><div class="mc top"><div class="qh">Prior strategic plan activities, 2023–2026</div>' + drows(['<span class="pn">Safety and Belonging</span>', '<b>3.1</b> Safety and infrastructure improvements', '<b>3.2</b> Home visits and family/community engagement', '<b>3.3</b> Behavior systems']) + '</div>' +
    '<div class="mc top"><div class="qh">Where action steps are likely to land</div>' + drows(['Consistent professional learning around behavior', 'Safety infrastructure', 'Multi-Tiered Systems of Support: one schoolwide system of expectations and tiered supports', 'Connectedness: a trusted adult and a place to belong', 'Responsive approaches to violent behavioral incidents', 'Family engagement: families as partners in safety, behavior and belonging']) + '</div></div></div>' + groupStrip(2) + '</div>'},

  {id: 'sessions', part: 0, steps: 1, src: 'Committee packet. Board presentation: January 26, 2027.', html: () =>
    head('How we’ll work', 'What the three sessions produce', '', '', ['Chief', '2 min']) +
    '<div class="s-body"><div class="callout"><div><span class="qh" style="margin-bottom:4px">Draft goal statement · for session 2</span><b>Every student and every adult will be safe at school, and every student will have a trusted adult and a place to belong.</b></div></div>' +
    '<div class="card ex"><table class="pl sess"><thead><tr><th></th><th>Session 1 · Today</th><th>Session 2</th><th>Session 3</th></tr></thead><tbody>' +
    '<tr><td class="rk">Produces</td><td class="now"><b>Community, data and first ideas</b></td><td><b>Goal statement; refine and select</b></td><td><b>Measures and metrics</b></td></tr>' +
    '<tr><td class="rk">In the room</td><td class="now">Hear what the community asked for and what the data shows. On page 6, write the three to five data needs the plan cannot leave out, with the evidence for each. Brainstorm action steps and choose your table’s top six.</td><td>Edit the draft goal statement, one version per table. Work the consolidated action steps: keep, edit, drop. Settle on three to five action steps for this group.</td><td>Final review of the goal and action steps. Implementation measures: what is done by the end of each year. A metric for each action step, with a baseline and a 2030 target.</td></tr>' +
    '<tr><td class="rk">Afterward</td><td class="now">The chiefs group the action-step ideas by area and merge duplicates.</td><td>The chiefs combine the goal drafts and prepare the measures framework.</td><td>A representative presents the group’s recommendation to the Board on ' + pc('<b>January 26, 2027</b>', '', 1) + '.</td></tr>' +
    '</tbody></table></div></div>'},

  {id: 'heard', part: 1, steps: 1, src: '2026 strategic plan survey; Listen and Learn sessions and follow-up survey (as of November 3); Principal Academy, October 1, 2026; Student Advisory Council, October 2026.', html: () =>
    head('Community voice', 'Before the data, the people', 'teal', 'Who we heard from since August', ['Chief or R&E', '1 min']) +
    '<div class="s-body"><div class="card" style="padding:54px 48px"><div class="nrow" style="grid-template-columns:1.25fr 1fr 1fr 1fr">' +
    '<div><div class="k">Community survey</div><b>' + pc('1,301', '', 0) + '<small>responses</small></b><p>August 18 to September 4. 72% families, 34% staff, 10% community members, 4% students. 961 wrote in a goal of their own.</p></div>' +
    '<div><div class="k">Town halls</div><b>8<small>sessions</small></b><p>Listen and Learn, one in each trustee district, September through November, plus <span style="font-weight:900;color:var(--navy-900)">160</span> follow-up survey responses.</p></div>' +
    '<div><div class="k">Principals</div><b>29<small>notetakers</small></b><p>One from each table at Principal Academy, October 1.</p></div>' +
    '<div><div class="k">Students</div><b>7<small>notetakers</small></b><p>Student Advisory Council, October. Both groups chose the topics they most wanted the plan to address.</p></div></div></div>' +
    take('Research and Evaluation pulled out the comments and themes that speak to safety, belonging and behavior. That is what the next screens show.', 1) + '</div>'},

  {id: 'survey', part: 1, steps: 1, src: '2026 strategic plan survey. Who responded: select all that apply, n = 1,301. Most important goal: single choice, n = 1,264.', html: () => {
    const roles = SV.roles.map(r => '<div class="fs"><div class="fn"><b>' + nf(r[0]) + '</b><span>' + r[1] + '</span></div></div>').join('');
    const bars = SV.goals.map((g, i) => hb('<small>#' + (i + 1) + '</small>' + g[0], g[1], 24, g[2], false, i === 1 ? pc('23%', '', 1) : g[1] + '%')).join('');
    return head('Community voice', '23% selected Safety and Belonging as the most important goal, a point behind academics', 'teal', 'Academic Growth and Achievement 24%, Safety and Belonging 23%, write-ins 22%. 2026 strategic plan survey.', ['Chief or R&E', '2 min']) +
      '<div class="s-body"><div class="tr" style="grid-template-columns:520px 1fr"><div class="card funnel" style="gap:16px"><div class="qh">Who responded · select all</div>' + roles + '<div class="foot">Includes 50 responses on the Spanish-language version. Participants could select more than one role.</div></div>' +
      '<div class="card" style="padding:26px 34px;display:flex;flex-direction:column;justify-content:center;gap:6px;--lab:440px"><div class="qh">Most important goal · single choice</div>' + bars + '<div class="foot">#3 is the write-in option: people who proposed a goal of their own and then chose it as most important.</div></div></div></div>'; }},

  {id: 'writeins', part: 1, src: '2026 strategic plan survey, “If you could add a goal, what would you propose?” 1,264 people answered. Proportions are estimates; some responses could be coded more than one way.', html: () => {
    const bars = SV.writeins.map(w => hb(w[0], w[1], 14, w[2] || '', true)).join('');
    return head('Community voice', 'Asked to add a goal, four of the top write-in themes touch this group’s work', 'teal', '“If you could add a goal, what would you propose?”', ['Chief or R&E', '2 min']) +
      '<div class="s-body"><div class="tr" style="grid-template-columns:1.2fr .8fr"><div class="card" style="padding:22px 34px;display:flex;flex-direction:column;justify-content:center;--lab:390px"><div class="qh">Estimated proportion of proposed goals</div>' + bars + '<div class="foot">Gold bars are the themes with comments about behavior, safety, belonging or mental health. Of the 340 who added a new goal, 284 chose their own goal as most important.</div></div>' +
      '<div class="qset" style="grid-template-rows:1.55fr .85fr .85fr 1fr">' +
      quote('Every educator will have the time, resources, professional trust, and meaningful support necessary to meet the diverse needs of students while maintaining a sustainable and healthy working environment.', 'Proposed sixth goal', 'plain') +
      quote('Every student will be allowed to be a child! More recess and unstructured play time with peers.', 'Proposed sixth goal', 'plain') +
      quote('Actually have students meet grade-level requirements before moving on.', 'Proposed sixth goal', 'plain') +
      quote('I would not add a goal. Five things to focus on feels like enough.', 'Proposed sixth goal', '') + '</div></div></div>'; }},

  {id: 'people', part: 1, src: '2026 strategic plan survey: “Describe a truly great experience in a WCSD school,” 954 family responses.', html: () =>
    head('Community voice', 'Our people are our greatest strength', 'teal', 'Families describe a truly great experience in a WCSD school. 954 responses.', ['Chief or R&E', '2 min']) +
    '<div class="s-body"><div class="tr" style="grid-template-columns:1.45fr 1fr"><div class="card frows">' +
    '<div class="strow"><div class="rk"><b>1 in 3</b></div><div class="lab"><b>Teachers connecting with students</b><p>About one response in three describes one teacher who connected with a student and went out of their way for them.</p></div></div>' +
    '<div class="strow"><div class="rk"><b>1 in 3</b></div><div class="lab"><b>Great moments in school community</b><p>About one in three describe a festival, concert, field trip, game, or graduation where families felt part of a community.</p></div></div>' +
    '<div class="strow"><div class="rk"><b>1 in 6</b></div><div class="lab"><b>Welcoming arrivals of students and families</b><p>About one in six credit office staff, counselors, principals, coaches, or bus drivers who knew families by name.</p></div></div>' +
    '<div class="strow"><div class="rk"><b>1 in 6</b></div><div class="lab"><b>Students receiving the help they needed</b><p>About one in six describe a student who was struggling, was noticed, and turned a corner.</p></div></div></div>' +
    '<div class="qset" style="grid-template-rows:1.6fr 1fr 1fr 1fr">' +
    quote('The counselor assigned to my children’s elementary school provided extensive support, guidance, and empathy for my children. The counselor provided a safe space for them to go to and express their feelings.', 'Family member, survey', 'plain') +
    quote('She had a wonderful experience at her middle school with her team teachers for 7th and 8th grades. They connected well with her and made her feel welcomed and valued.', 'Family member, survey', 'plain') +
    quote('The school secretary always knows who I am, who my daughter is, and what class she’s in, even though we’re brand new to the school.', 'Family member, survey', 'plain') +
    quote('Coach reached out to us during the fire to check on us and make sure we were OK, confirming our son isn’t just a number, but an actual person with a name.', 'Family member, survey', 'plain') + '</div></div></div>'},

  {id: 'three', part: 1, steps: 2, src: 'Research and Evaluation summary of the 2026 strategic plan survey, Listen and Learn sessions, and Principal Academy.', html: () =>
    head('Community voice', 'What the community told us', 'teal', 'Three big takeaways', ['Chief or R&E', '1 min']) +
    '<div class="s-body" style="gap:0;padding:30px 80px;justify-content:space-evenly"><div class="q rv" data-step="0"><span class="qn">1</span><p>Academic success and student safety and well-being are equally important priorities.</p></div>' +
    '<div class="q rv" data-step="1"><span class="qn">2</span><p>Many in the WCSD community want a more balanced, student-centered educational experience.</p></div>' +
    '<div class="q rv alt" data-step="2"><span class="qn">3</span><p>WCSD’s greatest strength is its people, and retaining, recruiting, and supporting them is a top priority.</p></div></div>'},

  {id: 'finding', part: 1, src: SRC_RE + ' Themes are things many people said; a single comment does not make a theme.', html: () =>
    head('This group', 'What people asked for in this area', 'gold', 'Key finding', ['R&E', '2 min']) +
    '<div class="s-body"><div class="tr" style="grid-template-columns:1.15fr 1fr"><div class="cgw" style="gap:18px"><div class="k">Key finding</div><p style="font-size:38px;line-height:1.22;font-weight:800;color:#fff">Belonging, caring relationships and accessible supports are widely valued; people also want more consistent responses to bullying, disruptive behavior and mental health needs.</p><p>Stakeholders expect schools to be physically safe, emotionally supportive and welcoming. Their comments describe a combined behavior, mental health and staffing challenge.</p></div>' +
    '<div class="tside"><div class="soft teal" style="flex:1;justify-content:center"><div class="k">The future people describe</div><p>Students and employees experience safe, respectful, inclusive schools with predictable expectations, effective preventive supports and timely access to appropriate services.</p></div>' +
    '<div class="soft gold" style="flex:1;justify-content:center"><div class="k">The tension this group will have to work through</div><p><b>Consistent consequences and clear accountability</b> versus <b>individualized, preventive supports</b> for students who struggle with behavior.</p></div></div></div></div>'},

  {id: 'themes', part: 1, src: 'Research and Evaluation summary for Group 2, November 4, 2026. Survey = Strategic Plan Survey write-ins and the Listen and Learn follow-up survey · Town halls = Listen and Learn sessions · Principals = 29 Principal Academy tables, October 1.', html: () => {
    const T = [
      ['Behavior expectations and prevention', '22 of 29 principal tables discussed behavior; 9 each asked for training, school-based personnel, consequences or stronger Tier 1. Survey respondents sought both accountability and individualized supports.', 'S T P'],
      ['Serious aggression and intensive settings', '9 principal tables reported serious aggression (thrown furniture, physical aggression, class evacuations); 7 asked for alternative settings. Reports, not incident-system verification.', 'P T'],
      ['Student mental health and accessible counseling', 'Growing needs, unclear service navigation, and requests for counselors, social workers and psychologists; 5 principal tables proposed community mental-health partnerships.', 'S T P'],
      ['Bullying, harassment and respectful climate', 'Town hall participants emphasized bullying and discriminatory language. Coded comments seek protection from harassment and a positive climate; survey stories highlight being welcomed.', 'S T'],
      ['Special education and inclusive support', 'Town halls raised inclusion, staffing, placements and appropriate support; coded comments seek qualified educators and accessible facilities.', 'S T'],
      ['Relationships as protective assets', 'About 1 in 3 of 954 great-experience responses mention a teacher connection; 1 in 6 name welcoming staff. Town halls praised close-knit communities and trusted adults.', 'S T'],
      ['Family circumstances and coordinated supports', 'Comments connect attendance and readiness to basic needs, transport and access to care; town halls valued home visits, interpretation and resource navigation.', 'S T P'],
      ['Staff safety, stress and retention', 'Principals described behavior-related stress, burnout and educators leaving: 7 of 12 retention discussions named behavior. Community members linked stable adults to student success.', 'P S']];
    const tag = {S: who('hs', 'Survey'), T: who('both', 'Town halls'), P: who('ms', 'Principals')};
    // column-major order so the two columns read top to bottom
    const order = [0, 4, 1, 5, 2, 6, 3, 7];
    return head('This group', 'Eight themes, and where each one came from', 'gold', '', ['R&E', '3 min']) +
      '<div class="s-body"><div class="card themes2">' + order.map(i => '<div class="th"><b>' + T[i][0] + '</b><p>' + T[i][1] + '</p><div class="srcs2">' + T[i][2].split(' ').map(k => tag[k]).join('') + '</div></div>').join('') + '</div></div>'; }},

  {id: 'protect', part: 1, src: SRC_RE + ' Quotes: 2026 strategic plan survey, lightly edited for length; names and schools are not shown.', html: () =>
    head('This group', 'What people want protected, and what worries them', 'gold', 'Strengths and concerns from the survey, town halls and principal tables', ['R&E', '2 min']) +
    '<div class="s-body"><div class="ho" style="flex:1;min-height:0"><div class="soft teal"><div class="k">Strengths to preserve</div>' + drows(['Educators, office staff, counselors, coaches and other trusted adults who know students personally and create belonging', 'Counseling staff who give students a safe place to express concerns and get help', 'Relationship-based outreach, close-knit school communities and inclusive extracurricular experiences']) + '</div>' +
    '<div class="soft gold"><div class="k">Emerging concerns</div>' + drows(['Thin school-based behavior capacity, inconsistent expectations and uncertainty about consequences; severe behavior interrupting instruction', 'Bullying responses that families say are slow or insufficient; mental health and behavior needs that may exceed staffing and expertise', 'Delays in specialized services, limited intensive-placement pathways and staff burnout']) + '</div></div>' +
    '<div class="mrg four">' +
    quote('There have been several instances of bullying and the school doesn’t actually do anything more than say they have talked to the child; more monitoring of kids.', 'Family member, survey', 'plain', 'Bullying response') +
    quote('Extreme behaviors take up a disproportionate amount of time, both sped and gen ed. Teachers are feeling unsafe and students have the perception there is lack of consequences.', 'Principal town hall', 'plain', 'Behavior and safety') + quote('When we reach out for help, the suggestions are unrealistic to implement.', 'Principal town hall', 'plain', 'Support for schools') + quote('Create a school culture that consistently recognizes, encourages, and rewards positive behavior, academic effort, kindness, responsibility, and good citizenship, while also providing appropriate support and interventions for students who are struggling with behavior.', 'Survey response', '', 'Balancing recognition with support') + '</div></div>'},

  {id: 'write1', part: 1, talk: true, src: 'Stop and write · 3 minutes · individual', html: () => talk({kind: 'Stop and write · Part A, page 4', title: 'Capture it before we move on', how: 'Work alone for now. The table conversation comes later, once everyone has their own list.', min: 3,

  {id: 'areas', part: 3, src: 'Group 2 committee packet, Part B, page 7. The six areas are a starting frame, not a limit.', html: () =>
    head('Action steps', 'An action step is something the district should do', '', 'Six areas, from the committee packet', ['Chief', '3 min']) +
    '<div class="s-body"><div class="card lrows two">' +
    '<div class="lrow"><span class="qn">1</span><div><b>Consistent professional learning around behavior</b><p>Every adult trained the same way in the areas needed most.</p></div></div>' +
    '<div class="lrow"><span class="qn">4</span><div><b>Connectedness</b><p>A trusted adult and a place to belong for every student.</p></div></div>' +
    '<div class="lrow"><span class="qn">2</span><div><b>Safety infrastructure</b><p>Facilities, technology and staffing that keep campuses safe.</p></div></div>' +
    '<div class="lrow"><span class="qn">5</span><div><b>Responsive approaches to violent behavioral incidents</b><p>Clear, effective, consistent responses from the district to support schools when violent behavior incidences occur.</p></div></div>' +
    '<div class="lrow" style="border-bottom:0"><span class="qn">3</span><div><b>Multi-Tiered Systems of Support</b><p>One schoolwide system of expectations and tiered supports.</p></div></div>' +
    '<div class="lrow" style="border-bottom:0"><span class="qn">6</span><div><b>Family engagement</b><p>Families as partners in safety, behavior and belonging, with clear two-way communication.</p></div></div></div>' +
    '<div class="ho" style="flex:none"><div class="callout"><div><span class="qh" style="margin-bottom:2px">Example</span><b>“De-escalation training for every adult who works with students with high violent behavior incidences.”</b></div></div><div class="soft navy" style="justify-content:center"><p><b>A starting frame, not a limit.</b> Draft within the areas where you can. If an idea does not fit, write it anyway.</p></div></div></div>'},
  {id: 'own', part: 3, talk: true, src: 'On your own · 7 minutes · pre-work sheet, or Part B of the packet, pages 8 and 9', html: () => talk({kind: 'On your own', title: 'Your own ideas first', how: 'Quiet time, no discussion yet.', min: 7,
    phases: [[0, 'Add to your pre-work, or start fresh'], [5, 'Tag each idea with its area']],
    right: q(1, 'Add to the action step ideas you brought, or start fresh in Part B: page 8 for the suggested areas, page 9 for new ideas. Aim for three to five.') + q(2, 'Tag each one with the area it belongs to. Rough is fine: say what would happen and for whom.', true)})},

  {id: 'table', part: 3, talk: true, src: 'Table share · 20 minutes · round robin', html: () => talk({kind: 'Table share', title: 'Every idea on the table', how: 'Round robin. About two minutes per person; second turns after everyone has had a first.', min: 20, cls: 'navy',
    phases: [[0, 'Round robin, one person at a time'], [11, 'Second turns']],
    right: q(1, 'Each person reads their ideas; the table captures all of them on the table sheet.') + q(2, 'No evaluating yet. If two people have the same idea, note it once and mark that it came up twice.') + q(3, 'In your notetaker, on the “New ideas” page, page 9: write down ideas from others at your table that you want to remember.', true)})},

  {id: 'six', part: 3, talk: true, src: 'Table decision · 12 minutes · hand in the table sheet', html: () => talk({kind: 'Table decision', title: 'Choose your table’s top six', how: 'Not ranked. Six that the table would stand behind. Number them and hand the sheet in.', min: 12, cls: 'teal',
    right: q(1, 'From everything on the table sheet, select the ' + pc('six action steps', 'coral') + ' your table most wants the district to do.') +
      '<div class="soft navy"><div class="k">A keeper</div>' + drows(['Answers a need the table selected in Part A, section 3', 'Is something the community asked for', 'Is something the district could actually do', 'Could be read by a family member without explanation']) + '<div class="note">Between sessions the chiefs read every table’s six, group them by area, combine duplicates and bring back a consolidated list for session 2.</div></div>'})},

  {id: 'next', part: 3, src: 'Teachers: stipend form to ldavidson@washoeschools.net. Questions: accountability@washoeschools.net.', html: () =>
    head('Close', 'Thank you. Here is what happens next', '', '', ['Chief', '2 min']) +
    '<div class="s-body" style="gap:28px"><div class="nxt4">' +
    '<div class="nxc c1"><div class="num">Before session 2</div><h3>The chiefs sort your ideas</h3><p>Every table’s six action steps are grouped by area. Nothing is thrown away; duplicates are merged and counted.</p></div>' +
    '<div class="nxc c2"><div class="num">Session 2</div><h3>Goal statement and action steps</h3><p>Edit the draft goal statement. Work the consolidated list: keep, edit or drop, and settle on three to five for this group.</p></div>' +
    '<div class="nxc c3"><div class="num">Session 3</div><h3>Measures and metrics</h3><p>Final review, then what is done by the end of each year and a metric for each action step, with a baseline and a 2030 target.</p></div>' +
    '<div class="nxc c4"><div class="num">Board of Trustees</div><h3>This group’s recommendation</h3><p>A representative of the group presents it.</p><div class="date">January 26, 2027</div></div></div>' +
    '<div class="leave"><div class="lk2">Before you leave</div>' +
    '<div class="lv"><b>Hand in</b><span>Your table sheet with the six action steps</span></div>' +
    '<div class="lv"><b>Leave on your table</b><span>Your notetaker and your pre-work sheet</span></div>' +
    '<div class="lv"><b>Teachers</b><span>Sign the stipend form and scan it to ldavidson@washoeschools.net</span></div>' +
    '<div class="lv"><b>Questions</b><span>accountability@washoeschools.net</span></div></div></div>'},


  {id: 'close', part: 3, cls: 'hero', src: '', html: () =>
    '<div class="hero-one cl"><h1>Thank you</h1><div class="lead">Please leave your notetaker and pre-work sheet on your table. Questions: <b>accountability@washoeschools.net</b></div><div class="bar"></div><div class="by"><b>Dr. Paul LaMarca</b><b>Dr. Mike Paul</b><b>Seana Baker</b><b>Kyle Kemp</b><b>Dr. Joshua Padilla</b></div></div><img class="wm" src="' + LOGO_W + '" alt=""><div class="corner"></div>'},

  {id: 'show', part: 0, src: 'Committee packet, session 1. Each length adds up the minutes shown on the screens in that part.', html: () => {
    const sum = ids => ids.reduce((a, id) => a + (MINS[id] || 0), 0), ids = f => SCREENS.filter(f).map(s => s.id), hm = m => Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
    const segs = [['Welcome, agreements and introductions', 'Chief', ['show', 'why', 'agree', 'intro', 'share']], ['What this group covers; the three sessions; the notetaker', 'Chief', ['area', 'sessions', 'notetaker']],

    return head('Welcome', Math.abs(t - 120) <= 2 ? 'Our two hours today' : 'Our session today', '', '', ['Chief', '1 min']) +
    '<div class="s-body"><div class="tr" style="grid-template-columns:1fr 560px"><div class="card" style="padding:18px 30px;display:flex;flex-direction:column;justify-content:center"><table class="ag"><thead><tr><th>Start</th><th>Length</th><th>Segment</th><th>Who leads</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td class="t">' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>').join('') +
    '<tr class="end"><td class="t">' + hm(t) + '</td><td></td><td>We close</td><td></td></tr>' +
    '</tbody></table></div><div class="soft navy" style="justify-content:center"><div class="k">What you leave with today</div>' + drows(['A notetaker filled with what the community asked for and what the data shows', 'Your table’s top six action step ideas, handed in', 'A date: this group’s recommendation goes to the Board on January 26, 2027']) + '</div></div></div>'; }},

const LEAD = {intro: 'Chief', share: 'Chief', write1: 'Chief or R&E', pause1: 'R&E', pause2: 'R&E', narrow: 'R&E', own: 'Chief', table: 'Chief', six: 'Chief'};
const NT_A1 = 'Part A, section 1 (page 4)', NT_A2 = 'Part A, section 2 (page 5)', NT_A3 = 'Part A, section 3 (page 6)', NT_B = 'Part B (pages 8 and 9)';
const NO_REVEAL = ['heard', 'survey', 'abs', 'absgroups'];
SCREENS.forEach(s => {
  if (LEAD[s.id]) s.lead = LEAD[s.id];
  if (s.part === 1) s.nt = NT_A1; else if (s.id === 'narrow') s.nt = NT_A3; else if (s.part === 2) s.nt = NT_A2; else if (['areas', 'own', 'table'].includes(s.id)) s.nt = NT_B; else if (s.id === 'six') s.nt = 'Table sheet';

{ const k = SCREENS.findIndex(x => x.id === 'show'); const sh = SCREENS.splice(k, 1)[0]; SCREENS.splice(1, 0, sh); }

const PARTS = ['Welcome', 'Community voice', 'Data dive', 'Action steps'];

/* ---------- engine ---------- */
const state = {i: 0, step: 0};
const $ = s => document.querySelector(s);
function render() {
  SCREENS.forEach(s => { CUR = s; s.html(); }); /* first pass: every screen reports its minutes, so the agenda can add them up */
  $('#screens').innerHTML = SCREENS.map((s, i) => { CUR = s; return '<section class="screen ' + (s.cls || '') + (s.talk ? ' talk' : '') + '" data-i="' + i + '">' + s.html() + '</section>'; }).join(''); CUR = {};
  $('#jump').innerHTML = SCREENS.map((s, i) => { const t = (s.html().match(/<h1[^>]*>(.*?)<\/h1>/) || [, s.id])[1].replace(/<[^>]+>/g, '');
    const lbl = s.talk ? (s.html().match(/<h2>(.*?)<\/h2>/) || [, ''])[1] : t; return '<button type="button" data-go="' + i + '"><b>' + (i + 1) + '</b>' + esc(lbl) + '</button>'; }).join('');
  document.querySelectorAll('.timer').forEach(initTimer);
}
function show() {
  const S = SCREENS[state.i];
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('on', +el.dataset.i === state.i));
  const cur = document.querySelector('.screen.on');
  cur.querySelectorAll('.rv').forEach(el => el.classList.toggle('show', +el.dataset.step <= state.step));
  document.querySelectorAll('.screen:not(.on) .pc').forEach(el => el.classList.remove('draw'));
  cur.querySelectorAll('.pc').forEach(el => { const due = el.dataset.step == null || +el.dataset.step <= state.step; if (!due) el.classList.remove('draw'); else if (!el.classList.contains('draw')) el.classList.add('draw'); });
  document.querySelectorAll('.screen:not(.on) .pcs').forEach(el => el.classList.remove('show'));
  cur.querySelectorAll('.pcs').forEach(el => el.classList.toggle('show', +el.dataset.step <= state.step));
  cur.querySelectorAll('.rv-dim').forEach(el => el.classList.toggle('show', +el.dataset.step <= state.step));
  cur.dataset.step = state.step;
  $('#counterText').textContent = (state.i + 1) + ' of ' + SCREENS.length;
  $('#progressFill').style.width = ((state.i + 1) / SCREENS.length * 100) + '%';
  $('#srcline').textContent = S.src ? (S.talk ? S.src : 'Source: ' + S.src) : '';
  document.querySelectorAll('.parts span').forEach((p, k) => { p.classList.toggle('on', k === S.part); p.classList.toggle('done', k < S.part); });
  const more = state.step < (S.steps || 0);
  const nb = $('#nextBtn'); nb.textContent = more ? 'Reveal' : 'Next'; nb.className = more ? 'reveal' : 'primary';
  nb.disabled = !more && state.i === SCREENS.length - 1;
  $('#backBtn').disabled = state.i === 0 && state.step === 0;
  $('#notes').innerHTML = '<b>Notes, screen ' + (state.i + 1) + '.</b> ' + esc(NOTES[S.id] || '');
  document.querySelectorAll('#jump button').forEach(b => b.classList.toggle('cur', +b.dataset.go === state.i));
  try { history.replaceState(null, '', '#' + (state.i + 1)); } catch (e) { /* sandboxed preview */ }
}
function next() { const S = SCREENS[state.i]; if (state.step < (S.steps || 0)) state.step++; else if (state.i < SCREENS.length - 1) { state.i++; state.step = 0; } show(); }
function back() { if (state.step > 0) state.step--; else if (state.i > 0) { state.i--; state.step = SCREENS[state.i].steps || 0; } show(); }
function go(i) { state.i = Math.max(0, Math.min(SCREENS.length - 1, i)); state.step = 0; show(); }
function initTimer(t) {
  const min = +t.dataset.min, phases = JSON.parse(t.dataset.phases || '[]'), clock = t.querySelector('.clock'), ph = t.parentElement.querySelector('.phase');
  let left = min * 60, id = null;
  const draw = () => { const m = Math.floor(left / 60), s = left % 60; clock.textContent = m + ':' + String(s).padStart(2, '0');
    t.classList.toggle('warn', left <= 60 && left > 0); t.classList.toggle('done', left === 0);
    if (ph) { const el = (min * 60 - left) / 60; let cur = phases[0]; phases.forEach(p => { if (el >= p[0]) cur = p; }); ph.textContent = cur[1]; } };
  t.querySelector('.go').onclick = e => { e.stopPropagation(); if (id) { clearInterval(id); id = null; e.target.textContent = 'Resume'; } else { id = setInterval(() => { if (left > 0) { left--; draw(); } else { clearInterval(id); id = null; } }, 1000); e.target.textContent = 'Pause'; } };
  t.querySelector('.rs').onclick = e => { e.stopPropagation(); clearInterval(id); id = null; left = min * 60; t.querySelector('.go').textContent = 'Start'; draw(); };
  draw();
}
function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080), st = $('#stage');
  if ('zoom' in st.style) { document.body.classList.add('zoomfit'); st.style.zoom = s; } else st.style.transform = 'scale(' + s + ') translate(-50%,-50%)';
}
document.addEventListener('DOMContentLoaded', () => {
  render();
  const h = parseInt(location.hash.slice(1), 10); if (h) state.i = Math.min(SCREENS.length, Math.max(1, h)) - 1;
  show(); fit(); window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => { const k = parseInt(location.hash.slice(1), 10); if (k && k - 1 !== state.i) go(k - 1); });
  $('#nextBtn').onclick = next; $('#backBtn').onclick = back;
  $('#counter').onclick = e => { e.stopPropagation(); $('#jump').classList.toggle('on'); const c = document.querySelector('#jump button.cur'); if (c && c.scrollIntoView) c.scrollIntoView({block: 'nearest'}); };
  $('#jump').onclick = e => { const b = e.target.closest('button'); if (b) { go(+b.dataset.go); $('#jump').classList.remove('on'); } };
  document.addEventListener('click', e => { if (!e.target.closest('#jump')) $('#jump').classList.remove('on'); });
  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); back(); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SCREENS.length - 1);
    else if (e.key === 'n' || e.key === 'N') $('#notes').classList.toggle('on');
    else if (e.key === 't' || e.key === 'T') { const b = document.querySelector('.screen.on .timer .go'); if (b) b.click(); }
  });
});
